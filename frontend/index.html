<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피아노 템포 트레이너</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="error-banner" hidden></div>

  <section id="upload-screen">
    <button id="reload-last-file-btn" hidden>이전 파일 불러오기</button>
    <div id="drop-zone">
      파일을 선택하거나 여기로 드래그하세요<br>
      (.musicxml / .mxl)
      <input type="file" id="file-input" accept=".musicxml,.mxl,.xml">
    </div>
    <p id="license-credits">
      이 앱은 다음 오픈소스를 사용해요:
      <a href="https://github.com/rism-digital/verovio" target="_blank" rel="noopener">Verovio</a> (LGPL-3.0),
      <a href="https://github.com/jet2jet/js-synthesizer" target="_blank" rel="noopener">js-synthesizer</a> (BSD-3-Clause),
      <a href="https://github.com/jet2jet/fluidsynth-emscripten" target="_blank" rel="noopener">FluidSynth (WASM build)</a> (LGPL-2.1),
      <a href="https://github.com/101arrowz/fflate" target="_blank" rel="noopener">fflate</a> (MIT),
      피아노 사운드폰트 (GPL-3.0, 원본: <a href="https://sites.google.com/site/soundfonts4u/" target="_blank" rel="noopener">soundfonts4u</a>)
    </p>
  </section>

  <section id="practice-screen" hidden>
    <h1 id="title"></h1>

    <div class="controls-row">
      <button id="play-pause-btn">▶</button>
      <button id="restart-btn">⏮ 처음부터</button>
    </div>

    <div class="controls-row">
      <label for="bpm-slider">BPM</label>
      <input type="range" id="bpm-slider" min="20" max="200" value="80">
      <input type="number" id="bpm-number" min="20" max="200" value="80">
    </div>

    <div class="controls-row">
      <label><input type="checkbox" id="metronome-toggle"> 🔔 메트로놈</label>
    </div>

    <div class="controls-row">
      <label for="song-volume-slider">🎹 곡 음량</label>
      <input type="range" id="song-volume-slider" min="0" max="100" value="100">
    </div>

    <div class="controls-row">
      <label for="metronome-volume-slider">🔔 메트로놈 음량</label>
      <input type="range" id="metronome-volume-slider" min="0" max="100" value="100">
      <select id="metronome-sound-select">
        <option value="noise" selected>노이즈 틱</option>
        <option value="beep">사인 비프</option>
        <option value="woodblock">우드블록</option>
      </select>
    </div>

    <div id="progress-bar">
      <div id="progress-fill"></div>
      <div id="loop-range" hidden></div>
    </div>
    <div id="time-label">0:00 / 0:00</div>

    <div class="controls-row">
      <button id="set-loop-start-btn">구간 시작 지정</button>
      <button id="set-loop-end-btn">구간 끝 지정</button>
      <label><input type="checkbox" id="loop-toggle"> 🔁 반복</label>
    </div>
  </section>

  <script src="file-memory.js"></script>
  <script src="vendor/libfluidsynth-2.4.6.js"></script>
  <script src="vendor/js-synthesizer.min.js"></script>
  <script>
    // Bind js-synthesizer to the FluidSynth module NOW, before Verovio's
    // script (loaded next) overwrites window.Module with its own runtime.
    // js-synthesizer normally resolves `Module` lazily at first use, which
    // would otherwise pick up whichever WASM runtime loaded last.
    JSSynth.Synthesizer.initializeWithFluidSynthModule(window.Module);
  </script>
  <script src="vendor/fflate.js"></script>
  <script src="vendor/verovio-toolkit-wasm.js"></script>
  <script src="midi-parser.js"></script>
  <script src="xml-score-reader.js"></script>
  <script src="score-parser.js"></script>
  <script src="scheduler.js"></script>
  <script src="synth.js"></script>
  <script src="metronome.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js').catch((err) => {
          console.warn('서비스 워커 등록 실패:', err);
        });
      });
    }
  </script>
</body>
</html>
